name: CI

on:
  pull_request:
    branches:
      - main
      - dev

# No job in this workflow writes anything, so nothing is elevated below.
permissions:
  contents: read

# A new push to the pull request supersedes its own in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Prettier formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotmap-website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (version from .nvmrc) + npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: spotmap-website/.nvmrc
          cache: 'npm'
          cache-dependency-path: spotmap-website/package-lock.json

      - name: Install dependencies (npm ci — clean, from lockfile)
        run: npm ci

      - name: Check source formatting with Prettier
        run: npm run format:check

  build:
    name: Production build + tool tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotmap-website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (version from .nvmrc) + npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: spotmap-website/.nvmrc
          cache: 'npm'
          cache-dependency-path: spotmap-website/package-lock.json

      - name: Install dependencies (npm ci — clean, from lockfile)
        run: npm ci

      # build:pages chains the tools/ test suite, the production build, and the
      # deploy-artifact verifiers (asset paths, and no admin library in the initial
      # bundle), so this one step gates the artifact main deploys.
      - name: Build the deploy artifact (tool tests, production build, output verifiers)
        run: npm run build:pages

  test:
    name: Unit tests (Karma, headless Chrome)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotmap-website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (version from .nvmrc) + npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: spotmap-website/.nvmrc
          cache: 'npm'
          cache-dependency-path: spotmap-website/package-lock.json

      - name: Install dependencies (npm ci — clean, from lockfile)
        run: npm ci

      - name: Run unit tests once in headless Chrome
        run: npm test -- --no-watch --no-progress --browsers=ChromeHeadless

  database:
    name: 'Database: migrations, access rules and the insert-only sync'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotmap-website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (version from .nvmrc) + npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: spotmap-website/.nvmrc
          cache: 'npm'
          cache-dependency-path: spotmap-website/package-lock.json

      # Also installs the Supabase CLI: it is a pinned devDependency, so Dependabot's npm group
      # keeps it current and there is no setup action to pin separately.
      - name: Install dependencies (npm ci — clean, from lockfile)
        run: npm ci

      - name: Start the local Supabase stack (database, REST API, Storage) and apply the migrations
        run: npm run db:start

      - name: Run the database tests (pgTAP — admin, access rules, city_spots, insert-only sync)
        run: npm run db:test

      - name: Point the sync at the local stack
        run: |
          eval "$(npx supabase status -o env 2>/dev/null)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          case "$PUBLISHABLE_KEY" in
            sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH) ;; # gitleaks:allow
            *) echo "::warning::The local publishable key differs from src/environments/environment.ts" ;;
          esac

      - name: Seed the empty database from the committed datasets (no photos)
        run: npm run sync:supabase -- --db-only

      # The second run plans against the database the first one wrote: every spot must be found
      # already present, so a sync that would re-insert or duplicate anything fails the job.
      - name: Re-run the sync and require that it inserts nothing
        run: npm run sync:supabase -- --db-only --expect-no-inserts

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history — gitleaks scans every commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The MIT-licensed binary, not gitleaks-action, which is license-gated for
      # organization accounts. Bump GITLEAKS_VERSION and GITLEAKS_SHA256 together;
      # Dependabot cannot see a version pinned inside a run block.
      - name: Install gitleaks (pinned release, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --silent --show-error --fail --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan full history for committed secrets
        run: gitleaks git . --no-banner --redact
