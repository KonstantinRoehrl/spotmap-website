name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main

# Cancel previous runs when new commits are pushed
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the build job only reads. The deploy job elevates for itself below.
permissions:
  contents: read

jobs:
  build:
    name: Build Angular production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc) + npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: spotmap-website/.nvmrc
          cache: 'npm'
          cache-dependency-path: spotmap-website/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies (npm ci — clean, from lockfile)
        run: npm ci
        working-directory: spotmap-website

      - name: Build Angular app (production, base-href /spotmap-website/)
        run: npm run build:pages
        working-directory: spotmap-website

      # Pages serves /map from map.html with a 200 (a map/ folder would 301 to /map/ first).
      # Paths with no file of their own, such as /spot/<id>, still get 404.html and its 404 status.
      - name: Copy index.html to 404.html (fallback for any other path) and to map.html, home.html and about.html (so those routes answer 200)
        working-directory: ./dist/spotmap-website/browser
        run: |
          for page in 404 map home about; do
            cp index.html "$page.html"
          done

      - name: Upload Pages artifact (dist browser/)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist/spotmap-website/browser

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Publish artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1