<div
  class="map-container w-full h-full relative"
  [attr.aria-busy]="!mapReady() && failureReason() === null"
>
  <app-spot-map
    class="map-frame w-full h-full block"
    [style.opacity]="mapReady() ? 1 : 0"
    [city]="city()"
    [retryToken]="retryToken()"
    (loadEvent)="onLoadEvent($event)"
    (ready)="onRendererReady()"
    (failed)="onRendererFailed($event)"
  ></app-spot-map>

  <!-- Outside every @if and empty at first, so the region exists before the first announcement. -->
  <p class="sr-only" role="status" aria-live="polite">{{ announcement() }}</p>

  <!-- loading: the city's name decoding over ASCII rain, with the real load progress -->
  @if (!mapReady() && failureReason() === null) {
    <app-map-loader
      class="map-container__overlay"
      animate.leave="map-container__overlay--leaving"
      [city]="city()"
      [state]="loadState()"
      (finished)="onBarFinished()"
    />
  }

  <!-- error / timeout: phosphor terminal message on --color-surface, never white -->
  @if (failureReason() !== null) {
    <div
      class="map-error map-container__overlay absolute top-0 left-0 w-full h-full flex flex-col justify-center items-center"
      role="alert"
      animate.leave="map-container__overlay--leaving"
    >
      @if (failureReason() === 'unsupported') {
        <!--
          The condition is a browser without WebGL 2 — what MapLibre needs — not a browser
          without WebGL at all, which is what an iOS 14 Safari on this path has. The line says
          the part its reader can act on rather than the version number they cannot.
        -->
        <p class="map-error__line">
          &gt; NO RENDERER // THIS BROWSER CANNOT DRAW THE MAP
        </p>
      } @else {
        <p class="map-error__line">&gt; SIGNAL LOST // MAP UNREACHABLE</p>
        <button
          type="button"
          class="map-error__retry phosphor-bloom"
          appPointerBloom
          (click)="retry()"
        >
          &gt; RETRY
        </button>
      }
    </div>
  }
</div>
