<div
  class="map-container w-full h-full relative"
  [attr.aria-busy]="!mapReady() && failureReason() === null"
>
  @switch (renderer()) {
    @case ('gmaps') {
      <app-gmaps-embed
        class="map-frame w-full h-full block"
        [style.opacity]="mapReady() ? 1 : 0"
        [city]="city()"
        [retryToken]="retryToken()"
        (ready)="onRendererReady()"
        (failed)="onRendererFailed($event)"
      ></app-gmaps-embed>
    }
    @case ('maplibre') {
      <app-spot-map
        class="map-frame w-full h-full block"
        [style.opacity]="mapReady() ? 1 : 0"
        [city]="city()"
        [retryToken]="retryToken()"
        (ready)="onRendererReady()"
        (failed)="onRendererFailed($event)"
      ></app-spot-map>
    }
  }

  <!-- loading: matrix-radar spinner over the dark surface -->
  @if (!mapReady() && failureReason() === null) {
    <app-loading-bar
      class="absolute top-0 left-0 w-full h-full flex justify-center items-center"
      role="status"
      aria-live="polite"
      aria-label="Loading map"
    ></app-loading-bar>
  }

  <!-- error / timeout: phosphor terminal message on --color-surface, never white -->
  @if (failureReason() !== null) {
    <div
      class="map-error absolute top-0 left-0 w-full h-full flex flex-col justify-center items-center"
      role="alert"
    >
      @if (failureReason() === 'unsupported') {
        <!--
          The condition is a browser without WebGL 2 — what MapLibre needs — not a browser
          without WebGL at all, which is what an iOS 14 Safari on this path has. The line says
          the part its reader can act on rather than the version number they cannot.
        -->
        <p class="map-error__line">
          &gt; NO RENDERER // THIS BROWSER IS TOO OLD FOR THIS MAP
        </p>
      } @else {
        <p class="map-error__line">&gt; SIGNAL LOST // MAP UNREACHABLE</p>
        <button type="button" class="map-error__retry" (click)="retry()">
          &gt; RETRY
        </button>
      }
    </div>
  }
</div>
