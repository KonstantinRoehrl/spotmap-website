<div
  class="gallery"
  [class.gallery--instant]="currentInstant()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  @if (currentFailed()) {
    <div
      class="gallery__placeholder"
      role="img"
      [attr.aria-label]="placeholderLabel()"
    >
      <span class="gallery__placeholder-line gallery__placeholder-line--lost"
        >&gt; SIGNAL LOST</span
      >&ngsp;<span
        class="gallery__placeholder-line gallery__placeholder-line--dim"
        >PHOTO UNREACHABLE</span
      >
    </div>
  } @else {
    @if (!currentLoaded()) {
      <div class="gallery__loading" animate.leave="gallery__loading--leaving">
        <app-ascii-rain [columns]="8" [rows]="6" />
      </div>
    }
    <img
      #photo
      class="gallery__photo"
      [class.gallery__photo--loaded]="thumbLoaded()"
      [src]="current()"
      [alt]="altText()"
      loading="lazy"
      decoding="async"
      (load)="onImageLoad($event)"
      (error)="onImageError($event)"
    />
  }

  <!-- Over the thumb (or the placeholder) and transparent until it has loaded; the thumb carries
       the alt text, so this copy is silent. -->
  @if (showsFull()) {
    <img
      #full
      class="gallery__full"
      [class.gallery__full--loaded]="fullLoaded()"
      [class.gallery__full--instant]="fullInstant()"
      [src]="currentFull()"
      alt=""
      decoding="async"
      (load)="onImageLoad($event)"
      (error)="onImageError($event)"
    />
  }

  @if (hasMany()) {
    <div
      class="gallery__controls"
      [class.gallery__controls--hidden]="!controls()"
      [inert]="!controls()"
    >
      <button
        type="button"
        class="gallery__nav gallery__nav--prev phosphor-bloom phosphor-bloom--inset phosphor-bloom--plate"
        appPointerBloom
        aria-label="Previous photo"
        (click)="previous()"
      >
        ‹
      </button>
      <button
        type="button"
        class="gallery__nav gallery__nav--next phosphor-bloom phosphor-bloom--inset phosphor-bloom--plate"
        appPointerBloom
        aria-label="Next photo"
        (click)="next()"
      >
        ›
      </button>
    </div>
  }
</div>
