<div
  class="gallery"
  [class.gallery--instant]="currentInstant()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  @if (showsRain()) {
    <div class="gallery__loading" animate.leave="gallery__loading--leaving">
      <app-ascii-rain [columns]="8" [rows]="6" />
    </div>
  }

  <!-- One block per slide, so a photo stepped to is a new element that fades in from nothing,
       whether or not it was already loaded. -->
  @for (slideUrl of [current()]; track slideUrl) {
    @if (currentFailed()) {
      <app-spot-photo-failed
        class="gallery__placeholder"
        [label]="placeholderLabel()"
      />
    } @else {
      <img
        #photo
        class="gallery__photo"
        [class.gallery__photo--loaded]="thumbLoaded()"
        [src]="current()"
        [alt]="altText()"
        loading="lazy"
        decoding="async"
        (load)="images.onLoad($event)"
        (error)="images.onError($event)"
        (transitionend)="onFadeEnd($event)"
      />
    }

    <!-- Over the thumb (or the placeholder) and transparent until it has loaded; the thumb carries
         the alt text, so this copy is silent. -->
    @if (showsFull()) {
      <img
        #full
        class="gallery__full"
        [class.gallery__full--loaded]="fullLoaded()"
        [class.gallery__full--instant]="fullInstant()"
        [src]="currentFull()"
        alt=""
        decoding="async"
        (load)="images.onLoad($event)"
        (error)="images.onError($event)"
        (transitionend)="onFadeEnd($event)"
      />
    }
  }

  <!-- The photo the last step left, beneath the incoming one until that has faded in. Decorative
       and silent: the incoming photo carries the alt text. Decoded synchronously, since it is
       already loaded and a late decode would leave a blank frame where the old photo was. -->
  @if (outgoingUrl(); as outgoing) {
    <img
      class="gallery__outgoing"
      [src]="outgoing"
      alt=""
      aria-hidden="true"
      decoding="sync"
    />
  }

  @if (hasMany()) {
    <div
      class="gallery__controls"
      [class.gallery__controls--hidden]="!controls()"
      [inert]="!controls()"
    >
      <button
        type="button"
        class="gallery__nav gallery__nav--prev phosphor-bloom phosphor-bloom--inset phosphor-bloom--plate"
        appPointerBloom
        aria-label="Previous photo"
        (click)="previous()"
      >
        ‹
      </button>
      <button
        type="button"
        class="gallery__nav gallery__nav--next phosphor-bloom phosphor-bloom--inset phosphor-bloom--plate"
        appPointerBloom
        aria-label="Next photo"
        (click)="next()"
      >
        ›
      </button>
    </div>
  }
</div>
