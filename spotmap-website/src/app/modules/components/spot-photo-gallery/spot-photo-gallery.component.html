<div
  class="gallery"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  @if (currentFailed()) {
    <div
      class="gallery__placeholder"
      role="img"
      [attr.aria-label]="placeholderLabel()"
    >
      <span class="gallery__placeholder-line">&gt; SIGNAL LOST</span>&ngsp;<span
        class="gallery__placeholder-line gallery__placeholder-line--dim"
        >PHOTO UNREACHABLE</span
      >
    </div>
  } @else {
    <img
      class="gallery__photo"
      [src]="current()"
      [alt]="altText()"
      loading="lazy"
      decoding="async"
      (error)="onImageError($event)"
    />
  }

  @if (hasMany()) {
    <button
      type="button"
      class="gallery__nav gallery__nav--prev"
      aria-label="Previous photo"
      (click)="previous()"
    >
      ‹
    </button>
    <button
      type="button"
      class="gallery__nav gallery__nav--next"
      aria-label="Next photo"
      (click)="next()"
    >
      ›
    </button>
    <span class="gallery__counter" aria-hidden="true">{{ counter() }}</span>
  }
</div>
