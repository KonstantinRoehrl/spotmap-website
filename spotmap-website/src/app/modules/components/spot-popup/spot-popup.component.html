<div class="spot-popup">
  @if (thumbnails().length > 0) {
    <app-spot-photo-gallery
      [photos]="thumbnails()"
      [spotName]="properties().name"
    />
    <p class="spot-popup__rights">© all rights reserved</p>
  }

  <p class="spot-popup__name">{{ properties().name }}</p>

  @if (properties().notes; as notes) {
    <p class="spot-popup__notes">{{ notes }}</p>
  }

  @if (isDemolished()) {
    <p class="spot-popup__status">&gt; DEMOLISHED</p>
  }

  <a
    class="spot-popup__directions"
    [href]="directionsHref()"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="'Directions to ' + properties().name"
    >&gt; DIRECTIONS</a
  >
</div>
