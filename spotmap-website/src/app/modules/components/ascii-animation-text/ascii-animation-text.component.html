<div class="ascii-container" #asciiContainer>
  <pre
    class="ascii-display select-none"
    [style.font-size.px]="renderedFontSize()"
  >
    @if (dotGutters()) {
      <span class="loading-dots"></span>
    }
    <span class="ascii-line">{{ baseText() }}</span>
    @if (dotGutters()) {
      <span class="loading-dots">{{ dots() }}</span>
    }
  </pre>
</div>
