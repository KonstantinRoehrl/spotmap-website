<div class="rail" role="group" [attr.aria-label]="'Photos of ' + spotName()">
  @for (src of photos(); track src; let i = $index, total = $count) {
    <button
      #photoButton
      type="button"
      class="rail__photo phosphor-bloom phosphor-bloom--inset"
      [class.rail__photo--instant]="instant().has(src)"
      appPointerBloom
      [attr.aria-label]="
        'Open photo ' +
        (i + 1) +
        ' of ' +
        total +
        (failed().has(src) ? ', did not load' : '')
      "
      (click)="open.emit(i)"
    >
      @if (failed().has(src)) {
        <app-spot-photo-failed class="rail__failed" />
      } @else {
        @if (!loaded().has(src)) {
          <span
            class="rail__loading"
            aria-hidden="true"
            animate.leave="rail__loading--leaving"
          >
            <app-ascii-rain [columns]="6" [rows]="5" />
          </span>
        }
        <img
          class="rail__img"
          [class.rail__img--loaded]="loaded().has(src)"
          [src]="src"
          alt=""
          loading="lazy"
          decoding="async"
          (load)="images.onLoad($event)"
          (error)="images.onError($event)"
        />
      }
    </button>
  }
</div>
