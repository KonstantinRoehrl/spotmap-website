<div class="app-container">
  <!-- Show intro until finished. Click/tap anywhere (or Esc / the button) skips. -->
  @if (!introFinished()) {
    <div class="intro-wrapper flex-auto" (click)="skipIntro()">
      <app-ascii-animation-text
        [messages]="['WELCOME TO THE SPOTMAP COMPENDIUM']"
        [waitFrames]="60"
        [animationSpeed]="35"
        (animationFinished)="onIntroFinished()"
        class="flex-auto"
      >
      </app-ascii-animation-text>

      <button
        type="button"
        class="intro-skip phosphor-bloom"
        appPointerBloom
        aria-label="Skip intro animation"
        (click)="skipIntro()"
      >
        [ SKIP ]
      </button>
    </div>
  }

  <!-- Show routed content after intro; the admin routes bring their own header. -->
  @if (introFinished()) {
    @if (!onAdminRoute()) {
      <app-nav-bar
        [links]="[
          { name: 'Home', url: '/home', icon: '⌂' },
          { name: 'Map', url: '/map', icon: '⌖', activeAlsoUnder: '/spot/' },
          { name: 'About', url: '/about', icon: 'ⓘ' },
        ]"
        class="nav-bar"
      >
      </app-nav-bar>
    }

    <div
      class="content-container flex-auto px-6"
      [class.content-container--admin]="onAdminRoute()"
      [class.content-container--map]="onMapPage()"
    >
      <router-outlet></router-outlet>
    </div>
  }
</div>
